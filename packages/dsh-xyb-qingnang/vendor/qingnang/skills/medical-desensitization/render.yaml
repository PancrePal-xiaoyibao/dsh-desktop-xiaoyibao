services:
  - type: web
    name: medical-desensitization
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: LOG_LEVEL
        value: log
      - key: DATA_DIR
        value: /var/data
      - key: MAX_DESENSITIZE_BODY_BYTES
        value: 10485760
      - key: MAX_DESENSITIZE_FILE_BYTES
        value: 20971520
      - key: NGINX_CLIENT_MAX_BODY_SIZE
        value: 20m
      - key: NEXT_PUBLIC_AI_CHAT_ENABLED
        value: false
