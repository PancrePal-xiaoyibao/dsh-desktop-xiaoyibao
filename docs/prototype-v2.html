    render(); return
  }
  if (a === 'privacy-ack') { S.privacyAck = true; toast('已启用云端解析。导入扫描件时会先提示上传。'); render(); return }
  if (a === 'mineru-policy' || a === 'open-mineru') { toast('原型演示：产品中会先提示将打开外部网站。'); return }
  if (a === 'token-toggle') { S.showToken = !S.showToken; render(); return }
  if (a === 'token-help') { S.tokenHelp = !S.tokenHelp; render(); return }
  if (a === 'token-env-sim') { S.envToken = !S.envToken; render(); return }
  if (a === 'parse-model') { S.model = t.dataset.model; render(); return }
  if (a === 'token-save') {
    const v = (S.tokenDraft || '').trim()
    if (!/^sk-[A-Za-z0-9._-]{8,}$/.test(v)) {
      S.tokenMsg = 'Token 格式不正确，应以 sk- 开头。请确认已完整复制。'; S.tokenMsgLv = 'warn'; render(); return
    }
    S.tokenTail = v.slice(-4); S.tokenDraft = ''; S.tokenMsg = '校验通过，已保存。'; S.tokenMsgLv = 'quiet'
    toast('Token 校验通过并已保存'); render(); return
  }
  if (a === 'token-verify') { S.tokenMsg = '校验通过。'; S.tokenMsgLv = 'quiet'; render(); return }
  if (a === 'token-remove') {
    S.tokenTail = ''; S.cloud = false; S.privacyAck = false
    S.tokenMsg = '已移除 Token，解析方式回到「仅本地」。'; S.tokenMsgLv = 'quiet'; render(); return
  }
  if (a === 'check-sources') { toast('原型演示：产品中会按渠道显示检查进度。'); return }
  if (a === 'change-path') { toast('原型演示：产品中会打开宿主目录选择器。'); return }
  if (a === 'backup-now') { toast('原型演示：产品中会执行备份并显示结果。'); return }
  if (a === 'care-back') { state.care = null; render(); return }
  if (a === 'rv-compare') { state.rvCompare = true; render(); return }
  if (a === 'rv-close-compare') { state.rvCompare = false; render(); return }
  if (a === 'dim-detail' || a === 'dim-edit') { toast(msgs[a]); if (a === 'dim-detail') { const d = t.dataset.dim; t.dataset.dim = d; } return }
  if (a === 'tl-reset') { state.tl.years = [2023, 2026]; state.tl.keys = true; state.tl.rate = false; state.tl.q = ''; state.tl.off[state.patient] = []; render(); return }  if (a === 'open-match') { state.pending = t.dataset.trial; state.page = 'match'; state.mat = 'analysis' }
  if (a === 'analyze') { state.pending = t.dataset.trial; state.page = 'match'; state.mat = 'analysis' }
  if (msgs[a]) toast(msgs[a])
  render()
})

// 一图秀控制项：局部更新，不整页重建（否则连续勾选会丢元素引用与焦点）
document.addEventListener('change', e => {
  const el = e.target
  if (el.id === 'tlKeys') { state.tl.keys = el.checked; renderTimelineRegions(); return }
  if (el.id === 'tlRate') { state.tl.rate = el.checked; renderTimelineRegions(); return }
  if (el.dataset && el.dataset.ind) {
    const pid = state.patient, sel = state.tl.sel[pid] || []
    const i = sel.indexOf(el.dataset.ind)
    if (el.checked && i < 0) sel.push(el.dataset.ind)
    if (!el.checked && i >= 0) sel.splice(i, 1)
    state.tl.sel[pid] = sel
    renderTimelineRegions(); return
  }
})
document.addEventListener('input', e => {
  const el = e.target
  if (el.id === 'tokenInput') {
    state.settings.tokenDraft = el.value
    // 只切换保存按钮可用性，不整页重建，避免输入丢焦点
    const btn = document.querySelector('[data-action="token-save"]')
    if (btn) btn.disabled = !el.value.trim()
    return
  }
  if (el.id !== 'tlSearch') return
  state.tl.q = el.value
  const pos = el.selectionStart
  // 指标列表需要随搜索词过滤，但保留搜索框本身
  const wrap = document.querySelector('#tlListRegion')
  if (wrap) {
    const pid = state.patient, S = pid === 'a' ? seriesA : seriesB
    const sel = state.tl.sel[pid] || []
    const q = state.tl.q.trim().toLowerCase()
    const names = Object.keys(S).filter(n => !q || n.toLowerCase().includes(q))
    wrap.innerHTML = names.length ? names.map(n => `
      <label><input type="checkbox" data-ind="${esc(n)}" ${sel.includes(n) ? 'checked' : ''}>
        <span>${esc(n)}</span><span class="unit">${esc(S[n].unit)}</span></label>`).join('')
      : '<p class="small muted">没有匹配的指标。</p>'
  }
  const n = $('#tlSearch')
  if (n) { n.focus(); try { n.setSelectionRange(pos, pos) } catch (_) {} }
})
document.addEventListener('blur', e => {
  const el = e.target
  if (el.id !== 'tlY0' && el.id !== 'tlY1') return
  const v = parseInt(el.value, 10)
  if (!Number.isFinite(v) || v < 2000 || v > 2099) { toast('年份需在 2000–2099 之间'); el.value = state.tl.years[el.id === 'tlY0' ? 0 : 1]; return }
  const y = state.tl.years
  if (el.id === 'tlY0') y[0] = Math.min(v, y[1]); else y[1] = Math.max(v, y[0])
  renderTimelineRegions()
}, true)

$('#patient').addEventListener('change', e => {
  state.patient = e.target.value
  state.page = 'dash'; state.rec = 'library'; state.mat = 'profile'
  render(); announce('已切换档案')
})
$('#envToggle').addEventListener('click', e => {
  state.settings.envToken = !state.settings.envToken
  e.target.setAttribute('aria-pressed', String(state.settings.envToken))
  if (state.page === 'settings') render()
  else toast(state.settings.envToken ? '已模拟：MINERU_TOKEN 环境变量存在' : '已取消模拟')
})
$('#settingsOpen').addEventListener('click', () => {
  if (state.page !== 'settings') state.settingsReturn = state.page
  state.page = 'settings'; state.aiOpen = false; $('#assistant').hidden = true
  render(); announce('已打开设置')
})
$('#aiOpen').addEventListener('click', () => { state.aiOpen = !state.aiOpen; $('#assistant').hidden = !state.aiOpen; if (state.aiOpen) renderAssistant() })
document.addEventListener('click', e => { if (e.target.id === 'aiClose') { state.aiOpen = false; $('#assistant').hidden = true } })
$('#hostToggle').addEventListener('click', e => {
  const h = $('#host'); h.classList.toggle('hidden')
  const on = !h.classList.contains('hidden')
  e.target.setAttribute('aria-pressed', String(on)); e.target.textContent = '宿主示意：' + (on ? '展开' : '收起')
})
$('#canvasWidth').addEventListener('change', e => {
  const v = e.target.value, f = $('#frame')
  if (v === 'auto') { f.style.maxWidth = ''; f.style.margin = '' }
  else { f.style.maxWidth = v; f.style.margin = '0 auto' }
})
$('#scenario').addEventListener('change', e => {
  state.scenario = e.target.value
  if (state.scenario === 'first') { state.patient = 'none' } else if (state.patient === 'none') { state.patient = 'a' }
  state.page = 'dash'; render()
})
$$('.main-tabs button').forEach(b => b.addEventListener('keydown', e => {
  const tabs = $$('.main-tabs button'), i = tabs.indexOf(b)
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    e.preventDefault(); const n = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length]; n.focus(); n.click()
  } else if (e.key === 'Home') { e.preventDefault(); tabs[0].focus(); tabs[0].click() }
  else if (e.key === 'End') { e.preventDefault(); const l = tabs[tabs.length - 1]; l.focus(); l.click() }
}))

render()
</script>
</body>
</html>
