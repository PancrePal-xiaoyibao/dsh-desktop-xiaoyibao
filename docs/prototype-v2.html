<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小胰宝 · 工作台设计原型 v0.4</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#1B3A34;background:#e4eae7;font-size:16px;line-height:1.65;font-synthesis:none;
/* 品牌色（取自官方 logo 采样） */
--ink:#1B3A34;--muted:#5A6E68;--green:#0F7C72;--green-dark:#0A5A53;--green-light:#95D0C7;
--wash:#F2F8F6;--line:#D7E5E0;--heart:#D9612B;
/* 红绿灯状态色 */
--good:#2E7D5B;--good-bg:#E8F5EE;--good-line:#9CCFB4;
--watch:#B8860B;--watch-bg:#FFF6DC;--watch-line:#E4CE8A;
--alert:#C0392B;--alert-bg:#FCEBE8;--alert-line:#E8AFA6;
--plum:#655472;--plum-bg:#F1F0F6;--plum-line:#C4BBD2;
--dash:#B9C9C3;
/* 病理阳性强度（浅→深） */
--ihc-3:#C7E5D3;--ihc-3l:#4E9670;--ihc-2:#DCEFE3;--ihc-2l:#6DAF88;--ihc-1:#EDF6F0;--ihc-1l:#94C4A8;}
*{box-sizing:border-box}body{margin:0}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button,select,input,textarea{border:1px solid #bfcfc6;border-radius:8px;background:#fff;color:var(--ink)}
button{min-height:42px;padding:8px 15px;font-weight:550;line-height:1.4}
button:hover{background:#eff6f2}
button:disabled{opacity:.6;cursor:wait}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid #a16d2c;outline-offset:3px}
input,select{min-height:44px;padding:8px 11px;width:100%}
textarea{padding:12px;width:100%;resize:vertical;min-height:112px;line-height:1.65}
input[type=checkbox]{width:18px;min-height:18px;accent-color:var(--green)}
h1,h2,h3,h4,p{margin:0}
h1{font-size:29px;font-weight:650;letter-spacing:.015em;line-height:1.4}
h2{font-size:20px;font-weight:630;line-height:1.5}
h3{font-size:17px;font-weight:620}
h4{font-size:15px;font-weight:600}
small,.small{font-size:13px;line-height:1.55}
.muted{color:var(--muted)}
.mono{font-family:SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums}
.primary{background:var(--green);color:#fff;border-color:var(--green)}
.primary:hover{background:#194f40}
.quiet{background:transparent;border-color:transparent}
.text-button{padding:3px 0;min-height:32px;border:0;background:none;color:var(--green);text-align:left}
.text-button:hover{background:none;text-decoration:underline}
.tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:5px;font-size:12px;line-height:1.6;font-weight:560;white-space:normal;background:var(--wash);color:var(--green-dark)}
.tag.good{background:var(--good-bg);color:var(--good)}
.tag.warn{background:var(--watch-bg);color:var(--watch)}
.tag.alert{background:var(--alert-bg);color:var(--alert)}
.tag.plum{background:var(--plum-bg);color:var(--plum)}
.tag.unknown{background:#fff;color:#6B7B73;border:1px dashed var(--dash)}
.tag.demo{background:#F1F0F6;color:#655472}
.tag.new{background:#E4F1EA;color:var(--good)}
/* 状态点：实心=有数据，虚线空心=未评估 */
.sdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block}
.sdot.good{background:var(--good)}
.sdot.warn{background:var(--watch)}
.sdot.alert{background:var(--alert)}
.sdot.plum{background:var(--plum)}
.sdot.unknown{background:transparent;border:1.5px dashed var(--dash)}
.actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:14px}
.stack{display:grid;gap:18px}
.divider{height:1px;background:var(--line);margin:20px 0}
.review-tools{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:12px 22px;background:#263d35;color:#fff;min-height:62px;font-size:13px;flex-wrap:wrap}
.review-tools strong{font-size:14px;margin-right:10px}
.review-tools .control-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.review-tools button,.review-tools select{font-size:12px;min-height:31px;width:auto;padding:5px 9px;background:#365046;color:#fff;border-color:#61766c}
.review-tools label{display:flex;align-items:center;gap:6px}
.review-tools button[aria-pressed=true]{background:#f2f7f3;color:#203b35}
.demo-ribbon{font-size:12px;background:#f5eedf;color:#674f27;padding:8px 22px;border-bottom:1px solid #e2d8c5;display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.desktop{display:flex;max-width:1636px;margin:20px auto;min-height:calc(100vh - 148px);border:1px solid #cbd7ce;border-radius:14px;overflow:hidden;box-shadow:0 12px 42px #2b49300d;background:#fff}
.host{width:196px;flex-shrink:0;background:#eaf0ec;border-right:1px solid #d5e0d9;padding:20px 15px;display:flex;flex-direction:column;gap:27px;color:#617469;font-size:13px}
.host .lights{display:flex;gap:7px;height:22px;align-items:center}
.lights span{width:11px;height:11px;background:#c3cfc7;border-radius:100%}
.host-caption{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#65796d}
.host-brand{font-weight:650;color:#314d3e;font-size:15px}
.host-selected{padding:10px 12px;background:#fff;border:1px solid #d9e2db;border-radius:8px;margin-top:10px;color:#315b47}
.host-session{padding:10px 3px;border-bottom:1px solid #dde5df}
.host-bottom{margin-top:auto}
.host.hidden{display:none}
.frame{flex:1;min-width:0;position:relative;container:workbench / inline-size;background:#f7faf8;overflow:hidden}
.frame>header{min-height:58px;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 26px;padding-left:calc(26px + var(--dsh-frame-leading-clearance,0px));border-bottom:1px solid var(--line)}
.brand{display:flex;gap:10px;align-items:center;white-space:nowrap;font-size:18px;font-weight:680}
.brand-logo{width:34px;height:34px;display:grid;place-items:center;flex-shrink:0}
.brand-logo img{width:30px;height:30px;display:block;object-fit:contain}
.tab-num{font-family:SFMono-Regular,Consolas,monospace;font-size:11.5px;font-weight:600;color:#8FA8A0;margin-right:6px;letter-spacing:-.02em}
.main-tabs button[aria-selected=true] .tab-num{color:var(--green)}
.header-right{display:flex;align-items:center;gap:15px}
.patient-picker{display:flex;align-items:center;gap:8px}
.patient-picker select{width:auto;min-height:36px;font-size:14px;padding:5px 26px 5px 10px}
.local-state{font-size:12px;color:var(--muted);white-space:nowrap}
.ai-button{font-size:14px;min-height:36px}
.dot{width:6px;height:6px;border-radius:50%;background:#498064;display:inline-block;margin-right:6px}
.dot.warn{background:#b8862b}
.dot.unknown{background:#a9b6ae}
.main-tabs{display:flex;flex-wrap:nowrap;gap:10px;background:#fff;border-bottom:1px solid var(--line);padding:0 26px;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;overscroll-behavior-x:contain}
.main-tabs button{flex:0 0 auto;white-space:nowrap}
.main-tabs button{border:0;border-radius:0;min-height:53px;padding:11px 19px;color:#5c6f65;background:transparent;position:relative;font-size:15px}
.main-tabs button[aria-selected=true]{color:var(--green);font-weight:650}
.main-tabs button[aria-selected=true]:after{position:absolute;content:"";height:3px;background:var(--green);bottom:0;left:17px;right:17px;border-radius:3px}
.page{padding:28px 32px 40px;max-width:1344px;margin:auto}
.page-heading{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:25px}
.page-heading p{margin-top:7px;color:var(--muted);font-size:14px}
.eyebrow{font-size:12px;color:var(--green);font-weight:600;letter-spacing:.07em;margin-bottom:9px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;min-width:0}
.card-title{margin-bottom:18px}
/* 区块序号 + 大标题（actlist 风格） */
.sec-title{display:flex;align-items:baseline;gap:12px;margin-bottom:4px}
.sec-num{font-family:SFMono-Regular,Consolas,monospace;font-size:14px;font-weight:600;color:#8FA8A0;letter-spacing:-.02em;line-height:1;flex-shrink:0}
.sec-title h2{font-size:22px;font-weight:650;letter-spacing:.01em;line-height:1.3;color:#1B3A34}
.sec-title .sec-count{font-size:13px;font-weight:500;color:var(--muted);margin-left:2px}
/* 状态图例 */
.lv-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:14px;align-items:center}
.lv-legend span{display:inline-flex;align-items:center;gap:6px}
/* 基因 / 病理卡片面板 */
.panel-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.mol-card{border:1px solid var(--line);border-radius:11px;padding:11px 12px;display:flex;flex-direction:column;gap:5px;min-width:0;background:#fff}
.mol-card .mc-head{display:flex;justify-content:space-between;align-items:center;gap:6px}
.mol-card .mc-name{font-size:13px;font-weight:650;color:#21453D;overflow-wrap:anywhere}
.mol-card .mc-result{font-size:14px;font-weight:620;line-height:1.35;overflow-wrap:anywhere}
.mol-card .mc-meta{font-size:11px;color:var(--muted);line-height:1.45}
.mol-card .mc-note{font-size:11px;color:var(--green);font-weight:550;line-height:1.4}
.mol-card.pos{background:#E4F1EA;border-color:#9CCFB4}
.mol-card.pos .mc-result{color:var(--good)}
.mol-card.neg{background:#F1F3F2;border-color:#DFE5E2}
.mol-card.neg .mc-result{color:#6B7B73;font-weight:550}
.mol-card.untested{border-style:dashed;border-color:var(--dash);background:#fff}
.mol-card.untested .mc-result{color:#8A9A92;font-weight:550}
.mol-card.vus{background:var(--watch-bg);border-color:var(--watch-line)}
.mol-card.vus .mc-result{color:var(--watch)}
.mol-card.ihc3{background:var(--ihc-3);border-color:var(--ihc-3l)}
.mol-card.ihc2{background:var(--ihc-2);border-color:var(--ihc-2l)}
.mol-card.ihc1{background:var(--ihc-1);border-color:var(--ihc-1l)}
.mol-card.ihc3 .mc-result,.mol-card.ihc2 .mc-result,.mol-card.ihc1 .mc-result{color:#1F6B4F}
.panel-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:13px}
.chip{font-size:12px;padding:5px 11px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;min-height:0;font-weight:520}
.chip[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}
.panel-sub{margin:0 20px 18px}
.kras-badge{font-size:11px;font-weight:650;padding:2px 7px;border-radius:5px;background:#C7E5D3;color:#1F6B4F}
.secondary-tabs{display:flex;gap:5px;margin:-5px 0 23px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.secondary-tabs button{border:0;border-radius:6px 6px 0 0;background:transparent;color:var(--muted);padding:11px 17px;white-space:nowrap}
.secondary-tabs button[aria-selected=true]{background:#e6f0e9;color:var(--green)}

/* ---- dashboard ---- */
.patient-strip{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;flex-wrap:wrap;margin-bottom:20px;padding:0 2px}
.patient-strip h1{font-size:26px}
.patient-strip .meta{margin-top:6px;font-size:14px;color:var(--muted);display:flex;gap:8px 16px;flex-wrap:wrap}
.completeness{text-align:right;min-width:190px}
.completeness b{font-size:24px;font-weight:620;color:var(--green)}
.completeness .bar{height:6px;border-radius:4px;background:#e2ece6;overflow:hidden;margin-top:8px}
.completeness .bar span{display:block;height:100%;background:#5c9a78}
.dash{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:22px;align-items:start}
.attention-list{display:grid;gap:0}
.attention-item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:15px 0;border-bottom:1px solid var(--line);align-items:start}
.attention-item:last-child{border-bottom:0;padding-bottom:0}
.attention-item:first-child{padding-top:0}
.attention-mark{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:6px;background:var(--watch)}
.attention-mark.alert{background:var(--alert)}
.attention-mark.watch{background:var(--watch)}
.attention-mark.plum{background:var(--plum)}
.attention-item h4{font-size:15px;font-weight:600;line-height:1.5}
.attention-item .basis{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.6}
.attention-item .basis .mono{color:#3f5a4f;font-weight:550}
.dim-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dim-card{border:1px solid var(--line);border-left-width:3px;border-radius:14px;padding:15px;background:#fff;display:flex;flex-direction:column;gap:9px;min-width:0;text-align:left;cursor:pointer;min-height:0;transition:border-color .12s,background .12s}
.dim-card.lv-good{background:var(--good-bg);border-color:var(--good-line);border-left-color:var(--good)}
.dim-card.lv-watch{background:var(--watch-bg);border-color:var(--watch-line);border-left-color:var(--watch)}
.dim-card.lv-alert{background:var(--alert-bg);border-color:var(--alert-line);border-left-color:var(--alert)}
.dim-card.lv-conflict{background:var(--plum-bg);border-color:var(--plum-line);border-left-color:var(--plum)}
.dim-card.lv-unknown{border-style:dashed;border-left-style:dashed;border-color:var(--dash);background:#fff}
.dim-card:hover{filter:brightness(.985)}
.dim-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.dim-head h4{font-size:14px;font-weight:620;color:#21453D}
.dim-value{font-size:22px;font-weight:620;font-variant-numeric:tabular-nums;line-height:1.25;overflow-wrap:anywhere}
.dim-value.sm{font-size:16px;font-weight:600}
.dim-note{font-size:12px;color:var(--muted);line-height:1.55}
.dim-foot{margin-top:auto;font-size:12px;color:var(--green);font-weight:550}
.care-strip{margin-top:22px}
.care-row{display:flex;gap:9px;flex-wrap:wrap}
.care-chip{font-size:13px;padding:7px 12px;border-radius:9px;background:#f4f7f5;border:1px dashed #cddbd3;color:#5d7268}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* ---- shared bits ---- */
.note{font-size:13px;padding:12px 15px;border-radius:8px;background:#f1f6f3;color:#50665a;line-height:1.65}
.note.warn{background:#fff5df;color:#76571b}
.note.error{background:#faece8;color:#934931}
.note.quiet{background:#f7f9f8;color:#5e7268}
.empty{text-align:center;padding:45px 22px;background:#fff;border:1px dashed #c7d8cc;border-radius:13px}
.empty-symbol{width:51px;height:51px;border:1px solid #c7dacd;border-radius:14px;color:#4e7a60;margin:0 auto 15px;display:grid;place-items:center;font-size:22px;background:#f0f7f2}
.empty p{font-size:14px;color:var(--muted);margin:10px auto 18px;max-width:34em}
.empty .actions{justify-content:center}
.first-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:25px}
.first-card{padding:30px}
.first-card p{font-size:14px;color:var(--muted);margin:15px 0 22px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted);font-size:13px}
.kv dd{margin:0}

/* ---- records ---- */
.library-list{display:grid;gap:0}
.document-row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:15px;align-items:center;padding:19px 0;border-bottom:1px solid var(--line)}
.document-row:last-child{border-bottom:0;padding-bottom:0}
.document-icon{width:43px;height:49px;border:1px solid #c8d9ce;border-radius:6px;background:#f3f7f4;display:grid;place-items:center;font-size:11px;letter-spacing:.03em;color:#517360}
.document-row h3{font-size:15px;font-weight:560;overflow-wrap:anywhere}
.document-row p{font-size:12px;color:var(--muted);margin-top:4px}
.document-row .actions{justify-content:flex-end}
.review-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.paper-wrap{padding:18px;background:#e8eeea;border:1px solid #d7e1db;border-radius:13px}
.paper-toolbar{display:flex;justify-content:space-between;gap:12px;color:#566c5d;font-size:12px;margin:0 0 13px}
.paper{background:#fff;padding:30px 23px;box-shadow:0 3px 12px #223d2912;min-height:410px}
.paper h3{text-align:center;font-size:18px;letter-spacing:.09em;margin-bottom:9px}
.paper .paper-demo{text-align:center;font-size:11px;color:#836b72;margin-bottom:24px}
.paper-table{width:100%;border-collapse:collapse;font-size:13px}
.paper-table th,.paper-table td{padding:12px 7px;text-align:left;border-bottom:1px solid #e2e6e3;white-space:normal}
.paper-table th{font-weight:500;color:#576a5f}
.paper-table tr.highlight{background:#fff4cd;outline:1px solid #e6cf91}
.source-callout{border-left:3px solid #b8cdbf;padding-left:13px;margin-top:22px;font-size:12px;color:var(--muted)}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.field label,.filter label{font-size:13px;font-weight:550;display:block;margin-bottom:6px}
.field .hint{margin-top:5px;font-size:12px;color:var(--muted)}
.review-foot{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap}
.chart-wrap{width:100%;overflow:hidden;margin-top:14px}
.chart{width:100%;height:auto;max-height:285px}
.chart text{font-family:inherit;fill:#607267;font-size:12px}
.chart .grid{stroke:#dfe8e2;stroke-width:1}
.chart .line{fill:none;stroke:#3c7960;stroke-width:2.7}
.chart .point{fill:#fff;stroke:#3c7960;stroke-width:2.5}
.table-wrap{overflow:auto;max-width:100%;margin-top:18px}
table.data-table{width:100%;border-collapse:collapse;font-size:14px;min-width:470px}
.data-table th,.data-table td{text-align:left;padding:13px 11px;border-bottom:1px solid var(--line)}
.data-table th{font-size:12px;font-weight:550;color:var(--muted);background:#f8faf8}
.summary-paper{max-width:850px;margin:0 auto;background:#fff;border:1px solid var(--line);padding:35px 40px;border-radius:4px;box-shadow:0 4px 20px #284b3405}
.summary-paper h2{font-size:25px;margin-bottom:9px}
.summary-section{margin-top:26px}
.summary-section h3{border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:12px}
.summary-section p,.summary-section li{font-size:14px;color:#3e564b}
.summary-section ul{padding-left:20px;margin:0}
.ref{font-size:12px;color:var(--green);text-decoration:none;border-bottom:1px dotted #9dc0ad;margin-left:5px;white-space:nowrap}

/* ---- 病情评估 ---- */
.assess-block{border:1px solid var(--line);border-radius:12px;padding:20px;background:#fff}
.assess-block h3{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.assess-list{display:grid;gap:11px}
.assess-item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:11px;font-size:14px;align-items:start}
.assess-item .bullet{color:#7ba48c;font-size:16px;line-height:1.4}
.timeline{padding:3px 0 0 6px;margin-top:6px}
.timeline-item{position:relative;padding:0 0 21px 24px;border-left:1px solid #d6e5db}
.timeline-item:last-child{padding-bottom:0;border-left-color:transparent}
.timeline-item:before{content:"";width:9px;height:9px;border-radius:50%;background:#8cae97;border:3px solid #fff;box-shadow:0 0 0 1px #a7c2af;position:absolute;left:-5px;top:5px}
.timeline-item time{font-size:12px;color:var(--muted)}
.timeline-item h3{font-size:15px;margin:4px 0}
.timeline-item p{font-size:13px;color:var(--muted)}

/* ---- 入组档案 ---- */
.profile-group{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden;margin-bottom:16px}
.profile-group>header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 20px;background:#f8faf8;border-bottom:1px solid var(--line);flex-wrap:wrap}
.profile-group>header h3{font-size:15px}
.profile-rows{display:grid}
.profile-row{display:grid;grid-template-columns:minmax(120px,.7fr) minmax(0,1.6fr) auto;gap:14px;padding:14px 20px;border-bottom:1px solid #eef3f0;align-items:start;font-size:14px}
.profile-row:last-child{border-bottom:0}
.profile-row .label{font-size:13px;color:var(--muted)}
.profile-row .val{overflow-wrap:anywhere}
.med-name{display:block}
.med-name .std{font-size:12px;color:var(--green);margin-top:2px;display:block}
.line-badge{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;border-radius:8px;background:#e6f0e9;color:#26604a;font-size:12px;font-weight:650;margin-right:9px}

/* ---- trials ---- */
.trial-grid{display:grid;grid-template-columns:minmax(0,1fr) 244px;gap:22px;align-items:start}
.filter-panel{padding:20px;margin-bottom:18px}
.search-row{display:flex;gap:10px;margin-bottom:17px}
.search-row input{min-width:0}
.search-row button{flex-shrink:0;padding-inline:23px}
.filter-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px}
.filter-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:15px;flex-wrap:wrap}
.filter-foot label{font-size:13px;display:flex;align-items:center;gap:8px}
.result-head{font-size:13px;display:flex;justify-content:space-between;gap:12px;align-items:center;margin:21px 0 12px}
.coverage-bar{font-size:12px;color:#5c7065;background:#f4f8f5;border:1px solid #e0eae4;border-radius:9px;padding:10px 13px;margin-bottom:14px;line-height:1.6}
.trial-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:23px;margin-bottom:14px}
.trial-card h3{font-size:18px;font-weight:600;line-height:1.55;margin:11px 0}
.trial-card .tags{display:flex;gap:7px;flex-wrap:wrap}
.trial-meta{display:flex;gap:7px 18px;font-size:13px;color:var(--muted);flex-wrap:wrap;margin:10px 0 17px}
.trial-bottom{border-top:1px solid #e9efeb;padding-top:13px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.source-card{padding:20px}
.source-unit{padding-top:16px;margin-top:16px;border-top:1px solid var(--line)}
.source-unit h3{font-size:14px}
.source-unit p{font-size:12px;margin-top:5px;color:var(--muted)}
.source-card .coverage{font-size:13px;margin:15px 0}
.source-label{font-size:11px;font-weight:650;letter-spacing:.05em;color:#5f7768;margin-bottom:8px}

/* ---- 匹配分析 ---- */
.match-summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.count-chip{display:flex;flex-direction:column;gap:2px;padding:11px 16px;border-radius:10px;border:1px solid var(--line);background:#fff;min-width:118px}
.count-chip b{font-size:22px;font-weight:640;font-variant-numeric:tabular-nums;line-height:1.2}
.count-chip span{font-size:12px;color:var(--muted)}
.count-chip.ok b{color:#26604a}
.count-chip.conf b{color:var(--gold)}
.count-chip.unk b{color:#7a8b82}
.count-chip.pend b{color:var(--plum)}
.match-group{border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:14px;overflow:hidden}
.match-group>header{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.match-group>header h3{font-size:15px}
.match-group.g-ok>header{background:#f6faf7}
.match-group.g-conf>header{background:#fffbf0}
.match-group.g-unk>header{background:#fafbfa}
.match-group.g-pend>header{background:#faf9fc}
.rule-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;padding:14px 20px;border-bottom:1px solid #eef3f0;align-items:start}
.rule-row:last-child{border-bottom:0}
.rule-mark{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:660;flex-shrink:0}
.rule-mark.ok{background:#e3f0e8;color:#26604a}
.rule-mark.conf{background:var(--gold-bg);color:var(--gold)}
.rule-mark.unk{background:#f1f4f2;color:#7a8b82;border:1px dashed var(--dash)}
.rule-mark.pend{background:var(--plum-bg);color:var(--plum)}
.rule-body h4{font-size:14px;font-weight:600;line-height:1.55}
.rule-basis{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.65}
.rule-basis .mono{color:#3f5a4f;font-weight:550}
.rule-basis .src{display:block;margin-top:3px;font-size:12px}
.rule-action{align-self:center}

/* ---- 渠道配置 ---- */
.channel-group{margin-bottom:22px}
.channel-group>h3{font-size:15px;margin-bottom:11px;color:#3a5a4c}
.channel-row{display:grid;grid-template-columns:auto minmax(0,1.5fr) minmax(0,1fr) auto;gap:14px;align-items:center;padding:15px 19px;border:1px solid var(--line);border-radius:11px;background:#fff;margin-bottom:9px;font-size:14px}
.channel-row.is-off{background:#fbfcfb}
.channel-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.channel-dot.ready{background:#4b8f6a}
.channel-dot.partial{background:#c2913a}
.channel-dot.off{background:#c2ccc6}
.channel-dot.fail{background:#a8695a}
.channel-name{display:flex;align-items:center;gap:11px;min-width:0}
.channel-name b{font-weight:600;overflow-wrap:anywhere}
.channel-facts{font-size:12px;color:var(--muted);line-height:1.6;overflow-wrap:anywhere}
.channel-actions{justify-self:end}

/* ---- 一图秀 ---- */
.tl-layout{display:grid;grid-template-columns:minmax(0,1fr) 244px;gap:22px;align-items:start}
.tl-chart-card{padding:20px}
.tl-chart-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.tl-chart-head h2{font-size:17px}
.tl-svg{width:100%;height:auto;display:block}
.tl-svg text{font-family:inherit}
.tl-axis{stroke:#cfdcd4;stroke-width:1}
.tl-grid{stroke:#e8efeb;stroke-width:1}
.tl-line{fill:none;stroke:#2f7a5c;stroke-width:2.4}
.tl-dot{fill:#fff;stroke:#2f7a5c;stroke-width:2.2}
.tl-dot.key{fill:#c2913a;stroke:#a8781f;stroke-width:2}
.tl-mark{stroke:#9fb3a8;stroke-width:1;stroke-dasharray:4 3}
.tl-mark-label{fill:#5e7a6c;font-size:11px}
.tl-label{fill:#63776c;font-size:11px}
.tl-tip{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.6}
.tl-timeline{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.tl-track{position:relative;height:74px;background:#f7faf8;border:1px solid #e6eeea;border-radius:9px;overflow:hidden;margin-top:12px}
.tl-block{position:absolute;top:12px;height:42px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#33463d;font-size:11.5px;font-weight:600;text-align:center;line-height:1.3;padding:2px 5px;overflow:hidden;border:1px solid #ffffff5c}
.tl-block.surgery{background:#f4c9c2}
.tl-block.gx{background:#f7e3a8}
.tl-block.four{background:#bcd9e8}
.tl-block.ag{background:#a9d5d0}
.tl-block.albu{background:#c3dcb8}
.tl-ticks{position:relative;height:20px;margin-top:4px}
.tl-ticks span{position:absolute;transform:translateX(-50%);font-size:11px;color:var(--muted);white-space:nowrap}
.tl-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--muted)}
.tl-legend button{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:none;min-height:30px;padding:3px 9px;font-size:12px;font-weight:500;color:var(--muted);border-radius:7px}
.tl-legend button:hover{background:#f1f6f3}
.tl-legend button[aria-pressed=false]{opacity:.42;text-decoration:line-through}
.tl-swatch{width:15px;height:11px;border-radius:3px;display:inline-block;border:1px solid #00000012}
.tl-controls{display:grid;gap:17px}
.tl-section h4{font-size:13px;margin-bottom:9px;color:#335445}
.tl-years{display:flex;gap:8px;align-items:center}
.tl-years input{min-height:38px;padding:5px 9px;font-size:13px}
.tl-checks{display:grid;gap:7px;max-height:270px;overflow:auto;padding-right:4px}
.tl-checks label{display:flex;align-items:center;gap:9px;font-size:13px;padding:5px 7px;border-radius:7px}
.tl-checks label:hover{background:#f4f8f5}
.tl-checks input{width:17px;min-height:17px;flex-shrink:0}
.tl-checks .unit{margin-left:auto;font-size:11px;color:#8b9c93}
.tl-search{min-height:38px;font-size:13px}

/* ---- 指标趋势：分类 + 卡片 + 小倍数图 ---- */
.ind-cats{display:flex;gap:8px;flex-wrap:wrap}
.ind-catn{font-family:SFMono-Regular,Consolas,monospace;font-size:11px;opacity:.7}
.cn-alert{color:var(--alert)}
.cn-watch{color:var(--watch)}
.ind-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ind-card{background:#fff;border:1px solid var(--line);border-left-width:3px;border-radius:13px;
  padding:14px 15px;display:flex;flex-direction:column;gap:7px;min-width:0;color:#8A9A92}
.ind-card.lv-good{border-left-color:var(--good);color:var(--good)}
.ind-card.lv-watch{border-left-color:var(--watch);color:var(--watch)}
.ind-card.lv-alert{border-left-color:var(--alert);color:var(--alert)}
.ind-card.lv-unk{border-left-color:var(--dash);border-left-style:dashed}
.ind-head{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;
  background:none;border:0;border-radius:0;min-height:0;padding:0;cursor:pointer;text-align:left}
.ind-name{font-size:13px;font-weight:600;color:#1F4038;overflow-wrap:anywhere}
.ind-lv{font-size:11.5px;font-weight:600;white-space:nowrap;color:currentColor}
.ind-value{display:flex;align-items:baseline;gap:4px}
.ind-none{font-size:17px !important;font-weight:550 !important;color:#8A9A92 !important}
.ind-value b{font-size:26px;font-weight:650;line-height:1.1;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;color:#1B3A34}
.ind-card.lv-alert .ind-value b{color:var(--alert)}
.ind-card.lv-watch .ind-value b{color:#8A6A0A}
.ind-unit{font-size:11.5px;color:var(--muted)}
.ind-ref{font-size:11.5px;color:var(--muted)}
.ind-spark{width:100%;height:40px;display:block;margin-top:2px}
.ind-body{border-top:1px solid #EEF3F0;margin-top:7px;padding-top:10px;color:var(--ink)}
.ind-read{font-size:12.5px;color:#4F6A5D;line-height:1.7}
.ind-alert{font-size:12.5px;color:#8E2A1E;background:var(--alert-bg);padding:8px 11px;
  border-radius:8px;margin-top:8px;line-height:1.65}
.ind-flag{font-size:12px;color:#76571B;background:var(--watch-bg);padding:7px 10px;
  border-radius:8px;margin-top:8px}
.ind-table{width:100%;border-collapse:collapse;margin-top:9px;font-size:12px}
.ind-table td{padding:4px 6px;border-bottom:1px solid #F2F6F4;color:#4F6A5D}
.ind-table td:last-child{text-align:right}
.ind-note{font-size:11.5px;color:#93A49B;margin-top:9px;line-height:1.6}

.sm-item{padding:14px 0;border-bottom:1px solid #F2F6F4}
.sm-item:last-of-type{border-bottom:0}
.sm-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:2px}
.sm-name{font-size:13.5px;font-weight:600;color:#1F4038;display:inline-flex;align-items:center;gap:7px}
.sm-dot{width:9px;height:9px;border-radius:3px;display:inline-block;flex-shrink:0}
.sm-unit{font-size:11.5px;color:#93A49B}
.sm-lv{font-size:12.5px;font-variant-numeric:tabular-nums;font-weight:600}
.sm-lv.lv-good{color:var(--good)}
.sm-lv.lv-watch{color:var(--watch)}
.sm-lv.lv-alert{color:var(--alert)}
.sm-svg{width:100%;height:auto;display:block}
.sm-more{font-size:12.5px;color:var(--muted);line-height:1.7;margin-top:12px;background:#F7FAF9;padding:11px 14px;border-radius:9px}
.sm-legend{display:flex;gap:18px;align-items:center;font-size:11.5px;color:var(--muted);margin-top:12px}
.sm-band{width:16px;height:10px;background:#EFF6F2;border-radius:3px;display:inline-block;margin-right:6px}
.sm-warn{width:16px;height:0;border-top:2px dashed #E4CE8A;display:inline-block;margin-right:6px}

/* ---- 血管通路器械卡 ---- */
.ac-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.ac-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:13px}
.ac-kind{font-size:15px;font-weight:640;color:#1B3A34}
.ac-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 20px;margin:0}
.ac-grid>div{display:flex;justify-content:space-between;gap:12px;align-items:baseline;
  padding-bottom:7px;border-bottom:1px solid #F2F6F4}
.ac-grid dt{font-size:12.5px;color:var(--muted);flex-shrink:0}
.ac-grid dd{margin:0;font-size:13.5px;color:#3F5A4F;text-align:right;overflow-wrap:anywhere}
.ac-foot{display:flex;justify-content:space-between;gap:12px;margin-top:13px;
  font-size:12.5px;color:var(--muted);flex-wrap:wrap}

/* ---- 报告核对：三栏 + 文档 list + 页导航 ---- */
.rv-toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.rv-modes{display:flex;gap:7px}
.rv-progress{font-size:13px;color:var(--muted)}
.rv-progress b{font-family:SFMono-Regular,Consolas,monospace;color:#2F5548}
.rv-layout{display:grid;grid-template-columns:230px minmax(0,1fr) minmax(280px,.85fr);gap:18px;align-items:start}
.rv-docs{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.rv-docs-head{padding:13px 16px;border-bottom:1px solid #EEF3F0;font-size:13px;font-weight:620;color:#1F4038;
  display:flex;justify-content:space-between;align-items:center}
.rv-count{font-size:12px;color:var(--muted);font-weight:450}
.rv-docs-body{max-height:560px;overflow:auto}
.rv-doc{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:0;min-height:0;
  padding:12px 14px;border-bottom:1px solid #F2F6F4;cursor:pointer;transition:background .12s}
.rv-doc:hover{background:#F7FAF9}
.rv-doc.is-on{background:#F1F7F4;box-shadow:inset 3px 0 0 var(--green)}
.rv-doc-mark{width:17px;flex-shrink:0;font-size:12px;color:#B9C9C3;text-align:center;line-height:1.5}
.rv-doc-mark.is-done{color:var(--good)}
.rv-doc-mark.is-pend{color:var(--watch);font-weight:700}
.rv-doc-main{display:flex;flex-direction:column;gap:4px;min-width:0}
.rv-doc-name{font-size:13px;font-weight:560;color:#243F37;overflow-wrap:anywhere;line-height:1.45}
.rv-doc-meta{font-size:11.5px;color:#93A49B}
.rv-pages{display:flex;gap:3px;flex-wrap:wrap;margin-top:2px}
.rv-pg{width:17px;height:17px;border-radius:5px;background:#EEF3F0;color:#7E8F87;font-size:10px;
  display:inline-grid;place-items:center;font-style:normal;font-weight:600;line-height:1}
.rv-pg.is-ocr{background:#E4EEF1;color:#3E6B7A}
.rv-pg.is-doubt{background:var(--watch-bg);color:var(--watch);box-shadow:0 0 0 1px var(--watch-line)}

.rv-view{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
.rv-view-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.rv-title{font-size:16px;font-weight:620;color:#1B3A34}
.rv-view-meta{font-size:12.5px;color:var(--muted);margin-top:5px}
.rv-view-actions{display:flex;gap:16px;align-items:center}
.rv-view .paper-wrap{padding:14px;background:#F4F7F5;border:1px solid #E3EBE7;border-radius:11px}
.rv-view .paper{box-shadow:none;border:1px solid #E9EFEB;min-height:0;padding:22px 18px}
.rv-view .paper h3{font-size:16px;letter-spacing:.02em}
.rv-view .paper-demo{margin-bottom:16px}
.rv-kv{display:grid;gap:9px;margin:0}
.rv-kv>div{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:baseline}
.rv-kv dt{font-size:12.5px;color:var(--muted)}
.rv-kv dd{margin:0;font-size:13.5px;color:#3F5A4F;line-height:1.6}
.rv-ocr-note{font-size:12.5px;color:#76571B;background:var(--watch-bg);border-radius:9px;
  padding:10px 13px;margin-bottom:13px;line-height:1.65}
.rv-ocr-note .text-button{display:inline;padding:0;min-height:0;margin-left:6px}
.rv-pager{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:15px}
.rv-pager-nums{display:flex;gap:5px}
.rv-pgbtn{width:28px;height:28px;min-height:0;padding:0;border-radius:7px;font-size:12px;
  background:#fff;border:1px solid var(--line);color:var(--muted)}
.rv-pgbtn.is-on{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.rv-pgbtn.is-doubt:not(.is-on){border-color:var(--watch-line);color:var(--watch)}
.rv-compare{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.rv-compare-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;
  font-weight:600;color:#1F4038;margin-bottom:11px}
.rv-compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rv-cmp-label{font-size:12px;color:var(--muted);margin-bottom:6px}

.rv-fields{padding:18px}
.rv-fields .card-title h3{font-size:15px}
.rv-bulk{display:flex;justify-content:space-between;align-items:center;gap:12px;
  font-size:12.5px;color:var(--muted);padding:10px 0;border-bottom:1px solid #EEF3F0}
.rv-bulk-actions{color:var(--green);font-weight:550}
.rv-row{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,.8fr) auto;gap:9px;
  align-items:center;padding:9px 8px;border-radius:8px;font-size:13px;cursor:pointer}
.rv-row:hover{background:#F7FAF9}
.rv-row.is-on{background:#EFF6F2}
.rv-row input{width:16px;min-height:16px;accent-color:var(--green)}
.rv-bulk-btn{width:100%;margin-top:12px}
.rv-foot{display:flex;align-items:center;gap:16px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}

/* ---- 设置页 ---- */
.path-code{font-family:SFMono-Regular,Consolas,monospace;font-size:12px;
  background:#F2F5F3;padding:2px 6px;border-radius:5px;color:#3F5A4F}
.gear-button{display:inline-flex;align-items:center;gap:6px;font-size:14px;min-height:36px;padding:6px 12px}
.gear-button[aria-pressed=true]{background:var(--wash);border-color:#B6CFC4;color:var(--green)}
.set-head{padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:28px}
.set-back{font-size:13px;color:var(--muted);min-height:0;padding:0 0 10px}
.set-back:hover{color:var(--green)}
.set-head h1{font-size:27px;font-weight:640}
.set-sub{font-size:14px;color:var(--muted);margin-top:8px}
.set-panel{padding:0}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding:15px 20px;border-bottom:1px solid #EEF3F0}
.set-row:last-child{border-bottom:0}
.set-row-main{display:flex;flex-direction:column;gap:4px;min-width:0}
.set-row-main b{font-size:14px;font-weight:600;color:#1F4038}
.set-row-desc{font-size:12.5px;color:var(--muted);line-height:1.55;overflow-wrap:anywhere}
.set-foot{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
  padding:12px 20px;border-top:1px solid #EEF3F0;background:#FBFCFC}
.set-hint{font-size:12px;color:#93A49B;line-height:1.55}
.set-msg{font-size:13px;padding:11px 14px;border-radius:9px;margin-top:11px;line-height:1.6;
  background:#F1F6F3;color:#4F6A5D}
.set-msg.warn{background:var(--watch-bg);color:var(--watch)}
.set-msg.error{background:var(--alert-bg);color:var(--alert)}

/* 解析方式单选：整块可点 */
.set-choice{display:flex;gap:13px;align-items:flex-start;padding:16px 20px;
  border-bottom:1px solid #EEF3F0;cursor:pointer;transition:background .13s}
.set-choice:hover{background:#F7FAF9}
.set-choice.is-on{background:#F4F9F6}
.set-choice input{margin-top:3px;width:17px;min-height:17px;flex-shrink:0;accent-color:var(--green)}
.set-choice-body{display:flex;flex-direction:column;gap:5px;min-width:0}
.set-choice-title{font-size:14px;font-weight:600;color:#1F4038;display:flex;align-items:center;gap:9px}
.set-choice-desc{font-size:12.5px;color:var(--muted);line-height:1.6}

/* 隐私告知 */
.privacy-box{margin:0;padding:17px 20px;background:var(--alert-bg);border-bottom:1px solid #EEF3F0}
.privacy-box b{font-size:13.5px;color:#8E2A1E;display:block;margin-bottom:9px}
.privacy-box ul{margin:0 0 13px;padding-left:19px;font-size:12.5px;color:#7A3E33;line-height:1.85}
.privacy-actions{display:flex;gap:16px;align-items:center;flex-wrap:wrap}

/* Token 区 */
.set-sub-block{padding:17px 20px;border-bottom:1px solid #EEF3F0}
.set-sub-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:11px}
.set-sub-head b{font-size:14px;font-weight:600;color:#1F4038}
.token-field{display:flex;gap:10px;align-items:center}
.token-field input{font-family:SFMono-Regular,Consolas,monospace;font-size:13px}
.token-field .text-button{flex-shrink:0}
.token-input .actions,.token-saved .actions{display:flex;gap:16px;align-items:center;margin-top:12px;flex-wrap:wrap}
.token-input .actions{margin-top:13px}
.token-saved code{display:inline-block;font-family:SFMono-Regular,Consolas,monospace;font-size:13px;
  background:#F2F5F3;padding:9px 13px;border-radius:9px;color:#3F5A4F;letter-spacing:.02em}
.token-saved .set-hint{display:block;margin-top:9px}
.help-box{margin:0;padding:17px 20px;background:#F7FAF9;border-bottom:1px solid #EEF3F0}
.help-box b{font-size:13.5px;color:#1F4038;display:block;margin-bottom:9px}
.help-box ol{margin:0 0 12px;padding-left:19px;font-size:12.5px;color:#4F6A5D;line-height:1.9}
.help-box .set-hint{margin-top:9px;display:block}
.set-radio{display:flex;gap:12px;align-items:flex-start;padding:11px 0;cursor:pointer}
.set-radio input{margin-top:3px;width:17px;min-height:17px;flex-shrink:0;accent-color:var(--green)}
.set-radio span{font-size:13.5px;color:#3F5A4F;line-height:1.6}
.set-radio .set-choice-desc{display:inline-block;margin-top:2px}

/* ---- 全程管理：2 列大卡片 ---- */
.cm-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.cm-card{display:flex;flex-direction:column;text-align:left;cursor:pointer;min-height:0;
  background:#fff;border:1px solid var(--line);border-radius:16px;padding:0;overflow:hidden;
  transition:border-color .14s cubic-bezier(.16,1,.3,1),box-shadow .14s cubic-bezier(.16,1,.3,1)}
.cm-card:hover{border-color:#B6CFC4;box-shadow:0 2px 14px rgba(31,64,56,.05)}
.cm-card:active{transform:translateY(1px)}
.cm-card.lv-watch{border-left:3px solid var(--watch)}
.cm-card.lv-alert{border-left:3px solid var(--alert)}
.cm-card.lv-unk{border-left:3px solid var(--dash)}
.cm-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 20px 0}
.cm-title{display:inline-flex;align-items:center;gap:9px;font-size:16px;font-weight:640;color:#1B3A34}
/* 图标：默认灰色（扁平），有特殊情况时跟随状态色 */
.page-h1-icon{display:inline-flex;align-items:center;gap:12px}
.page-h1-icon .cm-icon{width:28px;height:28px;color:#9AA9A2}
.page-h1-icon.lv-watch .cm-icon{color:var(--watch)}
.page-h1-icon.lv-alert .cm-icon{color:var(--alert)}
.cm-icon{width:22px;height:22px;flex-shrink:0;color:#9AA9A2;transition:color .14s}
.cm-card.lv-watch .cm-icon{color:var(--watch)}
.cm-card.lv-alert .cm-icon{color:var(--alert)}
.cm-card:hover .cm-icon{color:#7E8F87}
.cm-card.lv-watch:hover .cm-icon{color:var(--watch)}
.cm-card.lv-alert:hover .cm-icon{color:var(--alert)}
.cm-item .cm-icon{width:18px;height:18px;color:#9AA9A2}
.cm-item.lv-watch .cm-icon{color:var(--watch)}
.cm-item.lv-alert .cm-icon{color:var(--alert)}
.cm-title{gap:11px}
.cm-badge{font-size:11.5px;font-weight:600;color:#8A9A92;background:#F2F5F3;
  padding:3px 10px;border-radius:7px;white-space:nowrap}
.cm-card.lv-watch .cm-badge{background:var(--watch-bg);color:var(--watch)}
.cm-card.lv-alert .cm-badge{background:var(--alert-bg);color:var(--alert)}
.cm-desc{font-size:13px;color:var(--muted);line-height:1.6;padding:7px 20px 0;margin:0;min-height:42px}
.cm-metric{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;
  margin:16px 20px 0;padding:14px 16px;background:#F7F9F8;border-radius:11px}
.cm-metric-label{font-size:12px;color:var(--muted);width:100%;margin-bottom:2px}
.cm-metric-value{font-size:26px;font-weight:650;line-height:1.1;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;color:#1B3A34}
.cm-metric-sub{font-size:13px;color:#5F7A6E}
.cm-card.lv-alert .cm-metric-value{color:var(--alert)}
.cm-card.lv-watch .cm-metric-value{color:var(--watch)}
.cm-scope{margin:13px 20px 0;font-size:12.5px;color:#7E8F87;line-height:1.6;
  display:block;min-height:20px}
.cm-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;
  margin-top:auto;padding-top:12px;padding:12px 20px;border-top:1px solid #EEF3F0;
  font-size:12px;color:#93A49B;background:#FBFCFC}
.cm-foot span{min-width:0;overflow-wrap:anywhere}
.cm-link{font-size:12px;color:#6B8B7C;font-weight:500;text-align:right}

/* ==== 看板 v2：分层 + 大卡 + 折叠，降噪 ==== */
.pt-strip{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:30px}
.pt-id h1{font-size:28px;font-weight:640;letter-spacing:-.01em;line-height:1.25}
.pt-meta{font-size:14px;color:var(--muted);margin-top:7px}
.pt-verdict{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.vd{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;padding:7px 14px;border-radius:9px}
.vd-good{background:var(--good-bg);color:var(--good)}
.vd-watch{background:var(--watch-bg);color:var(--watch)}
.vd-alert{background:var(--alert-bg);color:var(--alert)}
.vd-unk{background:#F2F5F3;color:#6B7B73}
.pt-complete{font-size:13px;color:var(--muted)}
.pt-complete b{font-family:SFMono-Regular,Consolas,monospace;font-size:15px;color:#2F5548}

.sec{margin-bottom:30px}
.sec-h{font-size:15px;font-weight:640;color:#21453D;letter-spacing:.01em;margin-bottom:11px;display:flex;align-items:baseline;gap:11px}
.sec-sub{font-size:12.5px;font-weight:450;color:var(--muted)}

.panel{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.panel-empty{padding:26px 20px;text-align:center;font-size:14px;color:var(--muted)}
.panel-list{padding:0}

/* 关注项：一行一条，右侧来源，无重复按钮 */
.at-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:start;
  padding:15px 20px;border-bottom:1px solid #EEF3F0}
.at-row:last-child{border-bottom:0}
.at-dot{width:8px;height:8px;border-radius:50%;margin-top:7px}
.at-dot.watch{background:var(--watch)}
.at-dot.alert{background:var(--alert)}
.at-dot.plum{background:var(--plum)}
.at-main{min-width:0}
.at-title{display:block;font-size:14.5px;font-weight:600;color:#1F4038;line-height:1.5}
.at-basis{display:block;font-size:13px;color:var(--muted);margin-top:4px;line-height:1.6}
.at-basis .mono{color:#3F5A4F;font-weight:560}
.at-src{font-size:12px;color:#93A49B;text-align:right;max-width:190px;line-height:1.5;padding-top:2px}

/* 维度行：可展开，无卡片堆叠 */
.st-row{border-bottom:1px solid #EEF3F0}
.st-row:last-child{border-bottom:0}
.st-row.is-open{background:#FAFCFB}
.st-head{display:grid;grid-template-columns:auto 108px minmax(0,1fr) 62px 18px;gap:14px;align-items:center;
  width:100%;background:none;border:0;border-radius:0;padding:14px 20px;min-height:0;text-align:left;cursor:pointer;
  transition:background .13s cubic-bezier(.16,1,.3,1)}
.st-head:hover{background:#F7FAF9}
.st-head:active{transform:translateY(1px)}
.st-name{font-size:13.5px;color:var(--muted)}
.st-val{font-size:15px;font-weight:600;color:#1F4038;overflow-wrap:anywhere}
.st-lv{font-size:12px;font-weight:600;text-align:right;color:var(--muted)}
.st-row:has(.sdot.good) .st-lv{color:var(--good)}
.st-row:has(.sdot.watch) .st-lv{color:var(--watch)}
.st-row:has(.sdot.alert) .st-lv{color:var(--alert)}
.st-row:has(.sdot.plum) .st-lv{color:var(--plum)}
.st-chev{width:16px;height:16px;color:#A8B8B0;transition:transform .18s cubic-bezier(.16,1,.3,1)}
.st-row.is-open .st-chev{transform:rotate(180deg)}
.st-body{padding:0 20px 17px 42px}
.st-note{font-size:13px;color:var(--muted);line-height:1.65}
.st-actions{display:flex;gap:20px;margin-top:10px}

/* 全程管理：4 项一行，无卡片 */
.cm-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.cm-item{background:none;border:0;border-right:1px solid #EEF3F0;border-radius:0;padding:17px 20px;min-height:0;
  text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:7px;transition:background .13s}
.cm-item:last-child{border-right:0}
.cm-item:hover{background:#F7FAF9}
.cm-top{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;color:#1F4038}
.cm-status{font-size:12px;color:var(--muted)}
.cm-foot{padding:12px 20px;border-top:1px solid #EEF3F0;font-size:12.5px;color:var(--muted);background:#FBFCFC}

/* 图例与脚注：极简 */
.lg{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:#93A49B;margin-top:26px}
.lg span{display:inline-flex;align-items:center;gap:6px}
.ft{font-size:12px;color:#A0AEA7;margin-top:9px;text-align:center}

/* ---- 危机提示（心理支持四页常驻） ---- */
.crisis{border:1px solid var(--alert-line);border-left:4px solid var(--alert);background:var(--alert-bg);
  border-radius:12px;padding:15px 17px;display:flex;flex-direction:column;gap:8px;margin-top:22px}
.crisis strong{font-size:14px;color:#8E2A1E}
.crisis-row{display:flex;gap:8px 20px;flex-wrap:wrap;font-size:13px;color:#7A2E23}
.crisis-row b{font-weight:650}
.crisis .small{color:#8E5A52}

/* ---- 营养管理 ---- */
.nut-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.nut-card{border:1px solid var(--line);border-left-width:3px;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:7px}
.nut-card.lv-good{background:var(--good-bg);border-color:var(--good-line);border-left-color:var(--good)}
.nut-card.lv-watch{background:var(--watch-bg);border-color:var(--watch-line);border-left-color:var(--watch)}
.nut-card.lv-alert{background:var(--alert-bg);border-color:var(--alert-line);border-left-color:var(--alert)}
.nut-card.lv-unknown{border-style:dashed;border-color:var(--dash);background:#fff}
.nut-card .nh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nut-card .nh h4{font-size:13px;font-weight:620;color:#21453D}
.nut-card .nv{font-size:26px;font-weight:650;line-height:1.2;font-variant-numeric:tabular-nums}
.nut-card .nn{font-size:12px;color:var(--muted);line-height:1.5}
.energy-bar{height:14px;border-radius:7px;background:#E9F0EC;overflow:hidden;margin:10px 0 8px;position:relative}
.energy-bar span{display:block;height:100%;background:#4E9670}
.energy-legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

/* ---- 基因/病理：折叠 + 可点击基因名 ---- */
.pgrid-label{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.mc-name.is-link{display:inline-flex;align-items:center;gap:5px;background:none;border:0;padding:0;min-height:0;
  font-size:13px;font-weight:650;color:var(--green);cursor:pointer;text-align:left;border-bottom:1px dotted #9DC0AD}
.mc-name.is-link:hover{color:var(--green-dark)}
.mc-i{display:inline-grid;place-items:center;width:13px;height:13px;border-radius:50%;
  border:1px solid currentColor;font-size:9px;font-style:normal;font-weight:700;line-height:1;flex-shrink:0}
.fold-head{display:flex;align-items:center;gap:10px;width:100%;background:#FBFCFC;border:1px solid var(--line);
  border-radius:11px;padding:12px 15px;min-height:0;margin-top:14px;cursor:pointer;text-align:left;
  font-size:13px;color:#3F5A4F;font-weight:550;transition:background .13s}
.fold-head:hover{background:#F5F9F7}
.fold-chev{width:15px;height:15px;color:#A8B8B0;transition:transform .18s cubic-bezier(.16,1,.3,1);flex-shrink:0}
.fold-head[aria-expanded=true] .fold-chev{transform:rotate(90deg)}
.fold-n{margin-left:auto;font-size:12px;font-weight:450;color:#93A49B}
.fold-body{margin-top:12px}
.fold-note{font-size:12px;color:#93A49B;margin-top:11px;line-height:1.6}

/* ---- 营养：大数字 + 箭头（v2） ---- */
.nn-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.nn-card{background:#F4F6F5;border:1px solid #E6EBE8;border-radius:14px;padding:16px 17px;display:flex;flex-direction:column;gap:9px;min-width:0}
.nn-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nn-name{font-size:13px;color:var(--muted)}
.nn-lv{font-size:11.5px;font-weight:600;color:#8A9A92}
.nn-main{display:flex;align-items:baseline;gap:5px}
.nn-num{font-size:34px;font-weight:650;line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:#1B3A34}
.nn-unit{font-size:13px;color:var(--muted)}
.nn-delta{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;flex-wrap:wrap}
.nn-arrow{font-size:15px;line-height:1;font-weight:700}
.nn-delta.good{color:var(--good)}
.nn-delta.alert{color:var(--alert)}
.nn-delta.watch{color:var(--watch)}
.nn-delta.flat{color:#8A9A92;font-weight:450}
.nn-dv{font-variant-numeric:tabular-nums}
.nn-span{font-size:12px;font-weight:450;color:#93A49B}
.nn-reason{font-size:12px;color:var(--muted);line-height:1.5;margin-top:auto}
.nn-legend{font-size:12.5px;color:var(--muted);margin-top:13px;line-height:1.7}
.nn-legend b{font-weight:600}
.nn-legend b.good{color:var(--good)}
.nn-legend b.watch{color:var(--watch)}
.nn-legend b.alert{color:var(--alert)}
.dt-down{color:var(--alert)}
.dt-flat{color:var(--muted)}

/* 能量四步流程 */
.en-flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1fr;align-items:stretch;padding:0}
.en-step{padding:20px 22px;display:flex;flex-direction:column;gap:7px;min-width:0}
.en-arrow{display:grid;place-items:center;color:#C6D3CD;font-size:17px;padding:0 2px}
.en-label{font-size:12.5px;color:var(--muted)}
.en-value{font-size:29px;font-weight:650;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:#1B3A34}
.en-unit{font-size:13px;font-weight:450;color:var(--muted);margin-left:4px}
.en-note{font-size:12px;color:var(--muted);line-height:1.6}
.en-formula{font-family:SFMono-Regular,Consolas,monospace;font-size:11.5px;color:#7E8F87}
.en-gap.is-short{background:#FDF3F1}
.en-gap.is-short .en-value{color:var(--alert)}
.en-gap.is-ok{background:#F1F8F3}
.en-gap.is-ok .en-value{color:var(--good)}
.en-detail{padding:20px 22px;border-top:1px solid var(--line)}
.en-bar-wrap{margin-bottom:16px}
.en-bar{height:12px;border-radius:7px;background:#E9F0EC;overflow:hidden}
.en-bar span{display:block;height:100%;background:#4E9670}
.en-bar-lg{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:6px}
.en-kv{display:grid;gap:9px;margin:0}
.en-kv>div{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:baseline}
.en-kv dt{font-size:12.5px;color:var(--muted)}
.en-kv dd{margin:0;font-size:13px;color:#3F5A4F}
.en-actions{display:flex;align-items:center;gap:14px;margin-top:16px;flex-wrap:wrap}
.en-cur{font-size:12px;color:#93A49B}

/* ---- 心理支持 ---- */
.scale-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.scale-card{border:1px solid var(--line);border-radius:12px;padding:15px;background:#fff;display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer}
.scale-card:hover{border-color:#9CCFB4;background:#F7FBF9}
.scale-card h4{font-size:14px;font-weight:620;color:#21453D}
.scale-card .sc-cut{font-size:12px;color:var(--muted)}
.scale-card .sc-cut b{color:#38584B;font-weight:600}
.res-card{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff;margin-bottom:11px}
.res-card h4{font-size:15px;font-weight:620;margin-bottom:5px;color:#21453D}
.res-card p{font-size:13px;color:var(--muted);line-height:1.6}
.res-meta{font-size:11.5px;color:#8A9A92;margin-top:9px;display:flex;gap:14px;flex-wrap:wrap}
.res-no{font-family:SFMono-Regular,Consolas,monospace;font-size:14px;font-weight:600;color:var(--green)}
.grief-note{font-size:13px;color:#4A6357;line-height:1.7}

/* ---- 照护占位 ---- */
.care-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.care-card{border:1px dashed var(--dash);border-radius:12px;padding:19px;background:#fbfcfb;display:flex;flex-direction:column;gap:8px}
button.care-card{cursor:pointer;min-height:0;font-weight:400;transition:border-color .12s,background .12s}
button.care-card:hover{border-color:#a9c8b7;background:#f6faf7;border-style:solid}
.care-card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.care-card-head b{font-size:15px;font-weight:620;color:var(--ink)}
.care-card h3{font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.care-card p{font-size:13px;color:var(--muted);line-height:1.6}

/* ---- assistant / modal ---- */
.assistant-panel{position:absolute;z-index:5;right:0;top:0;bottom:0;width:min(440px,100%);background:#fff;box-shadow:-15px 0 60px #1f3c3322;border-left:1px solid #cbded0;padding:23px;display:flex;flex-direction:column;gap:20px;overflow:auto}
.assistant-panel .slot{border:1px dashed #bccfc2;border-radius:12px;flex:1;min-height:230px;display:grid;place-items:center;text-align:center;padding:26px;background:#f7faf8}
.assistant-panel .slot p{font-size:14px;margin-top:10px;color:var(--muted)}
dialog{border:1px solid #c3d5c8;border-radius:17px;padding:0;width:min(640px,calc(100% - 32px));max-height:85vh;color:var(--ink);box-shadow:0 20px 90px #12342333}
dialog::backdrop{background:#18382b55}
dialog .dialog-body{padding:28px;overflow:auto}
dialog h2{margin-bottom:10px}
dialog p{font-size:14px;color:var(--muted)}
dialog .dialog-footer{border-top:1px solid var(--line);padding:15px 28px;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;background:#f8faf8}
dialog .field{margin-top:17px}
.toast{position:fixed;z-index:20;bottom:25px;left:50%;transform:translateX(-50%);padding:12px 21px;border-radius:10px;background:#254d3c;color:#fff;box-shadow:0 5px 20px #1a322a22;font-size:14px;max-width:calc(100% - 32px)}
[hidden]{display:none!important}
.loading-bar{height:5px;border-radius:5px;background:#dde9e1;overflow:hidden;margin-top:12px}
.loading-bar span{display:block;width:48%;height:100%;background:#7da98b}
.footer-note{font-size:12px;color:#6a7d71;margin-top:24px;text-align:center}
.nowrap{white-space:nowrap}

@container workbench (max-width:1079px){
  .page{padding:25px 24px}
  .dash{grid-template-columns:1fr}
  .trial-grid{grid-template-columns:1fr}
  .source-card{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .source-card>div{min-width:0}
  .source-unit{margin:0;padding:0;border:0}
  .source-card .coverage{margin:6px 0}
  .source-card .source-actions{align-self:end}
  .frame>header{padding-inline:20px}
  .header-right{gap:10px}
  .local-state{display:none}
  .channel-row{grid-template-columns:auto minmax(0,1.3fr) minmax(0,1fr);row-gap:8px}
  .channel-actions{grid-column:2/4;justify-self:start}
  .tl-layout{grid-template-columns:1fr}
  .tl-controls{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .panel-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .rv-layout{grid-template-columns:200px minmax(0,1fr)}
  .ind-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .rv-fields{grid-column:1/-1}
  .nut-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .nn-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .en-flow{grid-template-columns:1fr auto 1fr;row-gap:0}

@container workbench (max-width:759px){
  .page{padding:23px 20px}

  .rv-compare-grid{grid-template-columns:1fr}
  .nn-grid{grid-template-columns:1fr 1fr}
  .en-flow{grid-template-columns:1fr}

  .card{padding:21px}

  .frame>header{padding-inline:18px}

  .filter-grid{grid-template-columns:1fr 1fr}

@container workbench (max-width:519px){

  .count-chip{flex:1;min-width:0}
}

   ① 8 色是「两两可区分」的上限。超过 8 个同屏指标时，颜色无法保证互不相似，
      因此界面限制同屏最多 8 个指标（超出按顺序分批或提示减少选择）。
   ② 明度从 56 拉到 139（5 档），保证灰度打印也能区分，不只靠色相。
   ③ 已用脚本验证任意两色 RGB 距离 ≥80 或明度差 ≥26。
   ④ 红绿不参与指标配色（留给状态语义）。 */

function colorFor(keys, k) {
  const i = keys.indexOf(k)
  return IND_PALETTE[(i < 0 ? 0 : i) % IND_PALETTE.length]

    : p.dims
  const have = state.scenario === 'sparse' ? 0 : p.completeness.have
  const total = p.completeness.total
  const keys = Object.keys(DIM_LABEL)
  const alertN = keys.filter(k => dims[k].lv === 'alert').length
  const watchN = keys.filter(k => dims[k].lv === 'watch').length
  const unkN = keys.filter(k => dims[k].lv === 'unk').length
  const openKey = state.dimOpen

  // 概要条：一句话说清"现在该看什么"
  const verdict = alertN ? `${alertN} 项警示` : watchN ? `${watchN} 项需关注` : unkN === total ? '尚无资料' : '未见警示项'
  const verdictLv = alertN ? 'alert' : watchN ? 'watch' : unkN === total ? 'unk' : 'good'

  // 一行一个维度：状态点 + 名称 + 主值 + 依据（可展开）
  const row = k => {
    const d = dims[k], lv = LV[d.lv], open = openKey === k
    return `<div class="st-row ${open ? 'is-open' : ''}">
      <button class="st-head" data-dim="${k}" aria-expanded="${open}">
        <i class="${lv.dot}" aria-hidden="true"></i>

      </button>
      ${open ? `<div class="st-body">
        <p class="st-note">${esc(d.note)}</p>
        <div class="st-actions">

          <button class="text-button" data-action="dim-edit" data-dim="${k}">补充资料</button>
        </div></div>` : ''}
    </div>`
  }

  const attRow = a => `<div class="at-row">
    <i class="at-dot ${a.lv === 'conf' ? 'plum' : a.lv}" aria-hidden="true"></i>
    <div class="at-main"><span class="at-title">${esc(a.title)}</span>
      <span class="at-basis">${a.basis}</span></div>
    <span class="at-src">${esc(a.src)}</span>
  </div>`

  return `<div class="pt-strip">
    <div class="pt-id">
      <h1>${esc(p.name)}</h1>
      <p class="pt-meta">${esc(p.sex)} · ${p.age} 岁 · ${esc(p.disease)} · 确诊 ${esc(p.dx)} · 资料更新至 ${esc(p.updated)}</p>
    </div>
    <div class="pt-verdict">
      <span class="vd vd-${verdictLv}"><i class="${LV[verdictLv].dot}" aria-hidden="true"></i>${esc(verdict)}</span>
      <span class="pt-complete">资料完整度 <b>${have}/${total}</b></span>
    </div>
  </div>

  <section class="sec">
    <h2 class="sec-h">需关注项 <span class="sec-sub">跨维度汇总</span></h2>
    <div class="panel">
      ${att.length ? att.map(attRow).join('') :
        `<p class="panel-empty">已记录内容中没有需关注项。这不代表病情稳定。</p>`}
    </div>
  </section>

  <section class="sec">
    <h2 class="sec-h">维度状态 <span class="sec-sub">7 个维度 · 点击展开依据</span></h2>
    <div class="panel panel-list">${keys.map(row).join('')}</div>
  </section>

  <section class="sec">
    <h2 class="sec-h">全程管理 <span class="sec-sub">贯穿治疗过程的四类管理</span></h2>
    <div class="panel">
      <div class="cm-grid">${careItems.map(c => {
        const done = c.status === '已有数据'
        return `<button class="cm-item lv-${done ? c.lv : 'unk'}" data-care="${c.id}">
          <span class="cm-top">${careIcon(c.id)}<b>${esc(c.name)}</b></span>

        </button>`
      }).join('')}</div>
      <div class="cm-foot">一期提供查看与记录，不做自动提醒推送。</div>

  </section>

  <div class="lg">
    ${['good', 'watch', 'alert'].map(l => `<span><i class="${LV[l].dot}"></i>${LV[l].label}</span>`).join('')}
    <span><i class="${LV.unk.dot}"></i>未评估</span>
    <span><i class="${LV.conf.dot}"></i>记录冲突</span>

  <p class="ft">看板只呈现已确认记录与缺口，不做医学判断。虚线 = 尚无数据，不代表正常。</p>`

/* 判定某指标某值的状态 */
function indStatus(key, v) {
  const c = CATALOG[key]
  if (v === null || v === undefined) return { lv: 'unk', label: '未评估', mark: '' }
  if (c.dangerLow !== undefined && v < c.dangerLow) return { lv: 'alert', label: '危险值', mark: '↓↓' }
  if (c.warnLow !== undefined && v < c.warnLow) return { lv: 'alert', label: '警示', mark: '↓' }
  if (c.lo !== null && v < c.lo) return { lv: 'watch', label: '偏低', mark: '↓' }
  if (c.hi !== null && v > c.hi) {
    if (c.warnHigh !== undefined && v > c.warnHigh * 1.6) return { lv: 'alert', label: '警示', mark: '↑' }
    return { lv: 'watch', label: '偏高', mark: '↑' }
  }
  return { lv: 'good', label: '正常', mark: '' }
}

function indCardHTML(key) {
  const c = CATALOG[key]
  const series = c.series || []
  const last = series.length ? series[series.length - 1][1] : null
  const st = indStatus(key, last)
  const rd = READINGS[key]
  const open = state.indOpen === key
  const range = c.lo === null && c.hi === null ? '个体化'
    : c.hi === null ? `≥${c.lo}` : c.lo === null ? `≤${c.hi}` : `${c.lo}–${c.hi}`
  const w = 260, h = 74, pad = 8
  let spark = ''
  if (series.length >= 2) {
    const vals = series.map(p => p[1])
    const mn = Math.min(...vals), mx = Math.max(...vals)
    const span = mx - mn || 1
    const X = i => pad + i * ((w - pad * 2) / (series.length - 1))
    const Y = v => h - pad - (v - mn) / span * (h - pad * 2)
    spark = `<svg class="ind-spark" viewBox="0 0 ${w} ${h}" aria-hidden="true">
      <path d="${series.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(' ')}"
        fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${X(series.length - 1).toFixed(1)}" cy="${Y(last).toFixed(1)}" r="3.4" fill="currentColor"/></svg>`
  }
  return `<div class="ind-card lv-${st.lv}">
    <button class="ind-head" data-indcard="${key}" aria-expanded="${open}">
      <span class="ind-name">${esc(c.name)}</span>
      <span class="ind-lv">${st.mark ? st.mark + ' ' : ''}${st.label}</span>
    </button>
    <div class="ind-value">${last === null
      ? '<b class="ind-none">未检测</b>'
      : `<b>${esc(String(last))}</b><span class="ind-unit">${esc(c.unit)}</span>`}</div>
    <div class="ind-ref">参考范围 ${esc(range)}</div>
    ${spark}
    ${open && rd ? `<div class="ind-body">
      <p class="ind-read">${esc(rd.text)}</p>
      ${rd.alert ? `<p class="ind-alert">${esc(rd.alert)}</p>` : ''}
      ${c.flag ? `<p class="ind-flag">${esc(c.flag)}</p>` : ''}
      ${series.length ? `<table class="ind-table"><tbody>${series.slice().reverse().map(p =>
        `<tr><td class="mono">${esc(p[0])}</td><td class="mono">${esc(String(p[1]))}</td></tr>`).join('')}</tbody></table>` : ''}
      <p class="ind-note">以上为数值描述与常见原因，不构成诊断。具体含义请以医生解释为准。</p>
    </div>` : ''}
  </div>`
}

/* 小倍数图：ECharts 折线风格 + 每指标独立颜色 + 标注防重叠 */
function smChartHTML(k, i, list) {
  const c = CATALOG[k], s = c.series || []
  const color = (list && Array.isArray(list)) ? IND_PALETTE[i % IND_PALETTE.length] : (IND_COLOR[k] || '#2F7A5C')
  const st = indStatus(k, s.slice(-1)[0][1])

  const w = 620, h = 132
  const pl = 54, pr = 62, pt = 18, pb = 26      // 左右留白给轴标签与末端数值
  const plotW = w - pl - pr, plotH = h - pt - pb

  // 纵轴范围：纳入参考范围与警戒线，避免线跑出画布
  let lo = Math.min(...s.map(p => p[1]))
  let hi = Math.max(...s.map(p => p[1]))
  if (c.lo !== null && c.lo !== undefined) lo = Math.min(lo, c.lo)
  if (c.hi !== null && c.hi !== undefined) hi = Math.max(hi, c.hi)
  if (c.warnLow !== undefined) lo = Math.min(lo, c.warnLow)
  const span0 = hi - lo || 1
  lo -= span0 * 0.18; hi += span0 * 0.18

  const X = i => pl + (s.length === 1 ? plotW / 2 : i * (plotW / (s.length - 1)))
  const Y = v => pt + plotH - (v - lo) / (hi - lo) * plotH

  // 参考范围底带
  const bandHi = c.hi === null || c.hi === undefined ? hi : Math.min(hi, c.hi)
  const bandLo = c.lo === null || c.lo === undefined ? lo : Math.max(lo, c.lo)
  const bandY = Y(bandHi), bandH = Math.max(0, Y(bandLo) - Y(bandHi))

  // 平滑折线（Catmull-Rom 转贝塞尔，近似 ECharts smooth）
  const pts = s.map((p, i) => [X(i), Y(p[1])])
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2
    const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6
    const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6
    d += ` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`
  }

  // 面积渐变填充
  const gid = `g-${k.replace(/[^A-Za-z0-9]/g, '')}`
  const area = `${d} L${pts[pts.length - 1][0].toFixed(1)},${(pt + plotH).toFixed(1)} L${pts[0][0].toFixed(1)},${(pt + plotH).toFixed(1)} Z`

  // 警戒线标注：贴左侧内缘，纵向偏移避开数据线
  let warn = ''
  if (c.warnLow !== undefined) {
    const wy = Y(c.warnLow)
    warn = `<line x1="${pl}" y1="${wy.toFixed(1)}" x2="${w - pr}" y2="${wy.toFixed(1)}"
        stroke="${color}" stroke-width="1.2" stroke-dasharray="4 4" opacity=".55"/>
      <text x="${pl + 4}" y="${(wy - 4).toFixed(1)}" fill="${color}" font-size="10" opacity=".85">警戒 ${c.warnLow}</text>`
  }

  // 末端数值标签：放在图右侧独立留白区，绝不压线
  const lastY = Y(s.slice(-1)[0][1])
  const lastLabel = `<text x="${pl + plotW + 7}" y="${(lastY + 3.5).toFixed(1)}"
      fill="${color}" font-size="11" font-weight="600">${s.slice(-1)[0][1]}</text>`

  // 日期：首末各一个 + 中间最多 2 个，避免挤在一起
  const tickIdx = s.length <= 4 ? s.map((_, i) => i)
    : [0, Math.round((s.length - 1) / 3), Math.round((s.length - 1) * 2 / 3), s.length - 1]
  const uniq = [...new Set(tickIdx)]

  return `<div class="sm-item">
    <div class="sm-head">
      <span class="sm-name"><i class="sm-dot" style="background:${color}"></i>${esc(c.name)}</span>
      <span class="sm-unit">${esc(c.unit)}</span>
    </div>
    <svg class="sm-svg" viewBox="0 0 ${w} ${h}" role="img"
      aria-label="${esc(c.name)} 趋势，末次 ${s.slice(-1)[0][1]} ${esc(c.unit)}">
      <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity=".18"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
      <rect x="${pl}" y="${bandY.toFixed(1)}" width="${plotW}" height="${bandH.toFixed(1)}" fill="#EFF6F2"/>
      <line x1="${pl}" y1="${(pt + plotH).toFixed(1)}" x2="${w - pr}" y2="${(pt + plotH).toFixed(1)}" stroke="#E3EBE7"/>
      <path d="${area}" fill="url(#${gid})"/>
      <path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
      ${s.map((p, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="3.2"
        fill="#fff" stroke="${color}" stroke-width="1.8"><title>${p[0]}：${p[1]} ${esc(c.unit)}</title></circle>`).join('')}
      ${warn}
      ${lastLabel}
      ${uniq.map(i => `<text x="${X(i).toFixed(1)}" y="${h - 8}" text-anchor="${i === 0 ? 'start' : i === s.length - 1 ? 'end' : 'middle'}"
        fill="#8A9A92" font-size="10">${esc(s[i][0].slice(2))}</text>`).join('')}
    </svg></div>`
}

function panelFilter(list, mode) {
  if (mode === 'pos') return list.filter(c => ['pos', 'ihc1', 'ihc2', 'ihc3', 'vus'].includes(c.state))
  if (mode === 'untested') return list.filter(c => c.state === 'untested')
  return list
}
function panelHTML(list, kind) {
  // 阳性/有变异直接展示；未检测与未突变折进可展开区
  const positive = list.filter(c => ['pos', 'ihc1', 'ihc2', 'ihc3', 'vus'].includes(c.state))
  const rest = list.filter(c => ['neg', 'untested'].includes(c.state))
  const negN = list.filter(c => c.state === 'neg').length
  const untN = list.filter(c => c.state === 'untested').length
  const key = kind + 'Rest'
  const open = !!state[key]
  const positiveLabel = kind === 'mol' ? '有变异' : '阳性'

  return `<div class="pgrid-label">${positiveLabel} ${positive.length} 项</div>
    <div class="panel-grid">${positive.map(molCard).join('')}</div>
    <button class="fold-head" data-fold="${key}" aria-expanded="${open}">
      <svg class="fold-chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>

function matAnalysis() {
  const tid = state.pending || 'T1'
  const t = trials.find(x => x.id === tid) || trials[0]
  const list = rules[t.id] || []
  const g = k => list.filter(r => r.g === k)
  const cnt = { ok: g('ok').length, conf: g('conf').length, unk: g('unk').length, pend: g('pend').length }
  const groups = [
    ['ok', '已满足', '✅', '符合规则条件', 'g-ok'],
    ['conf', '可能冲突', '⚠️', '与你的记录不一致 ： 需与研究中心核实', 'g-conf'],
    ['unk', '无法判定', '❓', '现有资料不足以判断 ： 缺失不等于不符合', 'g-unk'],
    ['pend', '待确认规则', '◌', '规则尚未人工确认，不计入上面三档', 'g-pend']
  ]
  return `<div class="page-heading"><div><div class="eyebrow">临床匹配</div><h1>匹配分析</h1>
    <p>${esc(t.title)}</p></div>
    <div class="actions"><button data-nav="match" data-mat="trials">返回列表</button>
      <button data-action="reanalyze">重新评估</button></div></div>

  <div class="match-summary">
    <div class="count-chip ok"><b>${cnt.ok}</b><span>已满足</span></div>
    <div class="count-chip conf"><b>${cnt.conf}</b><span>可能冲突</span></div>
    <div class="count-chip unk"><b>${cnt.unk}</b><span>无法判定</span></div>
    <div class="count-chip pend"><b>${cnt.pend}</b><span>待确认规则</span></div>
  </div>
  <div class="note warn" style="margin-bottom:18px">四类始终分别列出，不合并、不加总、不换算成百分比。
    <strong>本页不判断是否符合入组条件</strong>，最终判断请以医生和研究中心意见为准。</div>

  ${groups.map(([key, label, mark, hint, cls]) => {
    const items = g(key)
    if (!items.length) return ''
    return `<div class="match-group ${cls}"><header><span class="rule-mark ${key}">${mark}</span>
      <h3>${label}（${items.length}）</h3><span class="small muted">${hint}</span></header>
      ${items.map(r => `<div class="rule-row"><span class="rule-mark ${key}">${mark}</span>
        <div class="rule-body"><h4>${esc(r.text)}</h4>
          <p class="rule-basis">${esc(r.basis)}<span class="src">依据：${esc(r.src)}</span></p></div>
        <div class="rule-action">${key === 'unk' ? `<button class="text-button" data-action="fill">补充资料</button>`
          : key === 'pend' ? `<button class="text-button" data-action="confirm-rule">确认规则</button>`

function arrowFor(c) {
  // 颜色看「指标方向」，不看箭头方向
  if (c.delta === null || c.delta === undefined) return { mark: '', cls: 'flat', txt: '' }
  const rising = c.delta > 0
  const mark = rising ? '↑' : c.delta < 0 ? '↓' : '→'
  let cls
  if (c.dir === 'up_good') cls = rising ? 'good' : 'alert'
  else if (c.dir === 'down_good') cls = rising ? 'alert' : 'good'
  else cls = 'watch'                       // range 类：偏离即观察
  if (c.delta === 0) cls = 'watch'
  return { mark, cls, txt: c.deltaTxt }
}

function weightChartSVG() {
  const pts = nutrition.weightSeries
  const w = 660, h = 200, pad = 46, maxV = 60, minV = 46
  const X = i => pad + i * ((w - pad * 2) / (pts.length - 1))
  const Y = v => h - pad - (v - minV) / (maxV - minV) * (h - pad * 2)
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(' ')
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img"
    aria-label="体重趋势：${pts[0][0]} ${pts[0][1]}kg 至 ${pts[pts.length-1][0]} ${pts[pts.length-1][1]}kg">
    ${[48, 51, 54, 57, 60].map(v => `<line class="grid" x1="${pad}" y1="${Y(v)}" x2="${w - pad}" y2="${Y(v)}"/>
      <text x="${pad - 9}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`).join('')}
    <path class="line" d="${path}"/>
    ${pts.map((p, i) => `<circle class="point" cx="${X(i).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="4.2"><title>${p[0]}：${p[1]} kg</title></circle>`).join('')}
    ${pts.map((p, i) => `<text x="${X(i).toFixed(1)}" y="${h - 13}" text-anchor="middle">${esc(p[0].slice(0, 7))}</text>`).join('')}
  </svg>`
}

const TL_W = 700, TL_H = 300, TL_PAD = { l: 52, r: 22, t: 18, b: 34 }

function tlChart(pid) {
  const S = pid === 'a' ? seriesA : seriesB
  const sel = state.tl.sel[pid] || []
  const off = state.tl.off[pid] || []
  const shown = sel.filter(n => !off.includes(n) && S[n])
  const [y0, y1] = state.tl.years
  const t0 = new Date(y0, 0, 1).getTime()
  const t1 = new Date(y1, 11, 31).getTime()

  const data = shown.map(n => ({
    name: n, unit: S[n].unit, range: S[n].range,
    pts: S[n].pts.map(([d, v]) => [new Date(d).getTime(), v, d])
      .filter(([t]) => t >= t0 && t <= t1)
  })).filter(s => s.pts.length)

  if (!data.length) {
    return `<div class="empty" style="padding:34px 20px"><div class="empty-symbol" aria-hidden="true">◌</div>
      <p>当前时间范围与指标选择下没有数据。请调整年份或勾选其他指标。</p></div>`
  }

  // 单位分组：同一单位内归一化；不同单位不连线
  const groups = []
  data.forEach(s => {
    const g = groups.find(x => x.unit === s.unit)
    if (g) g.series.push(s); else groups.push({ unit: s.unit, series: [s] })
  })

  const plotW = TL_W - TL_PAD.l - TL_PAD.r
  const plotH = TL_H - TL_PAD.t - TL_PAD.b
  const allT = data.flatMap(s => s.pts.map(p => p[0]))
  const minT = Math.min(...allT), maxT = Math.max(...allT) || minT + 86400000
  const X = t => TL_PAD.l + (maxT === minT ? plotW / 2 : (t - minT) / (maxT - minT) * plotW)

  // 颜色取自全局 IND_PALETTE，与指标目录/趋势卡片一致。
  // 用指标名哈希取色，保证同一指标在任何视图颜色相同；冲突时顺延到下一个未占用色。
  const colorByName = (() => {
    const picked = {}
    return name => {
      if (picked[name] !== undefined) return picked[name]
      const used = Object.values(picked)
      let idx = 0
      for (const ch of String(name)) idx = (idx * 31 + ch.charCodeAt(0)) >>> 0
      for (let k = 0; k < IND_PALETTE.length; k++) {
        const c = IND_PALETTE[(idx + k) % IND_PALETTE.length]
        if (!used.includes(c)) { picked[name] = c; return c }
      }
      picked[name] = IND_PALETTE[idx % IND_PALETTE.length]
      return picked[name]
    }
  })()
  let svg = '', legendHints = [], ci = 0

  // 年网格
  for (let y = y0; y <= y1; y++) {
    const tx = X(new Date(y, 0, 1).getTime())
    if (tx < TL_PAD.l - 1 || tx > TL_W - TL_PAD.r + 1) continue
    svg += `<line class="tl-grid" x1="${tx.toFixed(1)}" y1="${TL_PAD.t}" x2="${tx.toFixed(1)}" y2="${TL_PAD.t + plotH}"/>
      <text class="tl-label" x="${tx.toFixed(1)}" y="${TL_H - 12}" text-anchor="middle">${y}</text>`
  }

  groups.forEach(g => {
    const vals = g.series.flatMap(s => s.pts.map(p => p[1]))
    let lo = Math.min(...vals), hi = Math.max(...vals)
    if (hi === lo) { hi = lo + 1; lo = Math.max(0, lo - 1) }
    const span = hi - lo
    lo = Math.max(0, lo - span * 0.18); hi = hi + span * 0.18
    const Y = v => TL_PAD.t + plotH - (v - lo) / (hi - lo) * plotH

    // 每单位组画自己的 y 轴标签（共用左轴，标单位）
    svg += `<text class="tl-label" x="${TL_PAD.l - 9}" y="${TL_PAD.t + 4}" text-anchor="end">${hi.toFixed(0)}</text>
      <text class="tl-label" x="${TL_PAD.l - 9}" y="${TL_PAD.t + plotH}" text-anchor="end">${lo.toFixed(0)}</text>
      <text class="tl-label" x="6" y="${TL_PAD.t + plotH / 2}" text-anchor="start" style="font-size:10px">${esc(g.unit)}</text>`

    g.series.forEach(s => {
      const color = colorByName(s.name)
      legendHints.push({ name: s.name, unit: s.unit, color })
      const d = s.pts.map((p, i) => `${i ? 'L' : 'M'}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(' ')
      svg += `<path class="tl-line" d="${d}" stroke="${color}"/>`
      s.pts.forEach((p, i) => {
        const isKey = state.tl.keys && S[s.name].key && (i === 0 || i === s.pts.length - 1)
        svg += `<circle class="tl-dot ${isKey ? 'key' : ''}" cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="${isKey ? 4 : 3.1}" stroke="${color}"><title>${esc(s.name)} ${p[2]}：${p[1]} ${esc(s.unit)}</title></circle>`
      })
      if (state.tl.keys) {
        s.pts.forEach((p, i) => {
          if (i !== 0 && i !== s.pts.length - 1) return
          svg += `<text class="tl-label" x="${X(p[0]).toFixed(1)}" y="${(Y(p[1]) - 9).toFixed(1)}" text-anchor="middle">${p[1]}</text>`
        })
      }
    })
  })

  // 标注竖线（贯穿整图）
  let markY = TL_PAD.t + 10
  ;(remarks[pid] || []).forEach(r => {
    const t = new Date(r.date).getTime()
    if (t < minT || t > maxT) return
    const tx = X(t)
    svg += `<line class="tl-mark" x1="${tx.toFixed(1)}" y1="${TL_PAD.t}" x2="${tx.toFixed(1)}" y2="${TL_PAD.t + plotH}"/>
      <text class="tl-mark-label" x="${tx.toFixed(1)}" y="${markY.toFixed(1)}" text-anchor="middle">${esc(r.text)}</text>`
    markY += 15
  })

  const warn = groups.length > 1
    ? `<div class="note warn" style="margin-top:12px">当前选择了 ${groups.length} 种不同单位的指标，已分组独立绘制，<strong>未合并连线</strong>。</div>`
    : ''

  return `<svg class="tl-svg" viewBox="0 0 ${TL_W} ${TL_H}" role="img"
      aria-label="指标趋势图：${data.map(s => s.name).join('、')}，${y0} 至 ${y1} 年">
      <line class="tl-axis" x1="${TL_PAD.l}" y1="${TL_PAD.t + plotH}" x2="${TL_W - TL_PAD.r}" y2="${TL_PAD.t + plotH}"/>
      ${svg}</svg>
    <div class="tl-legend" style="margin-top:6px">${legendHints.map(h =>
      `<span><i class="tl-swatch" style="background:${h.color}"></i>${esc(h.name)} <span style="color:#93a49b">${esc(h.unit)}</span></span>`).join('')}</div>
    ${warn}`
}

function tlTimeline(pid) {
  const lines = medLines[pid] || []
  if (!lines.length) return `<div class="note quiet">尚无用药方案记录。</div>`
  const [y0, y1] = state.tl.years
  const t0 = new Date(y0, 0, 1).getTime(), t1 = new Date(y1, 11, 31).getTime()
  const span = t1 - t0
  const pct = t => Math.max(0, Math.min(100, (t - t0) / span * 100))
  const off = state.tl.off[pid] || []
  const ticks = []
  for (let y = y0; y <= y1; y++) ticks.push(y)

  return `<div class="tl-track">${lines.map(l => {
    const s = new Date(l.start).getTime()
    const e = l.end ? new Date(l.end).getTime() : Math.min(t1, Date.now())
    const left = pct(s), width = Math.max(1.2, pct(e) - left)
    const dim = off.includes(l.label) ? 'opacity:.28' : ''
    return `<div class="tl-block ${l.cls}" style="left:${left.toFixed(2)}%;width:${width.toFixed(2)}%;${dim}"
      title="${esc(l.label)} ${esc(l.start)} 至 ${l.end ? esc(l.end) : '进行中'}">
      <span>${esc(l.tag)}<br>${esc(l.start.slice(0, 7))}${l.end ? '–' + esc(l.end.slice(0, 7)) : '–至今'}</span></div>`
  }).join('')}</div>
  <div class="tl-ticks">${ticks.map(y => {
    const p = pct(new Date(y, 0, 1).getTime())
    if (p < 0 || p > 100) return ''
    return `<span style="left:${p.toFixed(2)}%">${y}</span>`
  }).join('')}</div>
  <div class="tl-legend">${lines.map(l => `<button data-med="${esc(l.label)}" aria-pressed="${!off.includes(l.label)}">
    <i class="tl-medblock ${l.cls}" style="position:static;width:15px;height:11px;border-radius:3px;display:inline-block;border:1px solid #00000012"></i>${esc(l.label)}</button>`).join('')}</div>`
}
