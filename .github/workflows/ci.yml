name: CI

# SPEC ADR-701：日常检查用 Linux runner（快），发布用目标平台（另见 release.yml）。
# 三阶段（static / test / build）**并行**，无依赖关系。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一 ref 的旧运行取消，省配额
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────── 静态检查
  static:
    name: 静态检查（契约 / 脱敏 / 文案）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # 脱敏审计需要全史
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 插件包契约校验
        run: node scripts/check-plugin-contract.mjs

      - name: 插件完整性分析（抓「语法合法但运行时必炸」的 bug）
        run: node scripts/check-plugin-integrity.mjs

      - name: vendor 改造清单校验（V-1 / V-2）
        run: node scripts/check-vendor-modifications.mjs

      - name: 脱敏审计（工作区）
        run: node scripts/check-sanitization.mjs

      - name: 文案合规审计（零处方 / 零诊断）
        run: node scripts/check-copy-compliance.mjs

      - name: UI token 纪律
        run: node scripts/check-ui-tokens.mjs

      # 公开引用闸门：跟踪文件里不得出现指向「不存在的东西」的引用
      #   tasks/ 与 agent-reference/ 不随仓发布、变更档案不公开 ⇒ 引用它们等于给读者一个查不到的指路牌。
      #   vendor/ 路径**不阻断**（那是构建时由 fetch-upstream 创建的真实目录），只作提示。
      - name: 公开引用闸门（不得指向不存在的内部档案/路径）
        run: node scripts/check-public-references.mjs --strict

  # ─────────────────────────────────────────── 测试（并行）
  test:
    name: 测试（并行）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 本仓已不再包含 vendor/ 与嵌套 node_modules，测试所需依赖必须显式声明。
      # （曾从 vendor/dsh-desktop-main/node_modules 借 js-yaml → CI 干净检出必挂）
      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 并行测试
        run: bash scripts/test-parallel.sh

  # ─────────────────────────────────────────── 构建检查
  build:
    name: 构建检查（语法 / 结构）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 全量语法检查
        run: node scripts/check-syntax.mjs

      - name: 插件包可加载性检查（零 import / 零 JSX / 契约字段）
        run: node scripts/check-plugin-contract.mjs --strict

  # ─────────────────────────────────────────── 脱敏审计（全史）
  sanitization-history:
    name: 脱敏审计（git 全史）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 全史扫描
        run: node scripts/check-sanitization.mjs --history
